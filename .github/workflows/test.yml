
name: Test
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} with BUILD_SHARED_LIBS=${{matrix.shared}} SPZ_BUILD_EXTENSIONS=${{matrix.extensions}}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        shared: [ON, OFF]
        extensions: [ON, OFF]

    steps:
     - uses: actions/checkout@v4
     - uses: ilammy/msvc-dev-cmd@v1
       if: matrix.os == 'windows-latest'
     - name: Support longpaths
       run: git config --system core.longpaths true
       if: matrix.os == 'windows-latest'
     - uses: mamba-org/setup-micromamba@v2
       with:
           init-shell: bash
           environment-file: .github/environment.yml
           environment-name: "build"

     - name: Build
       shell: bash -l {0}
       env:
         CMAKE_GENERATOR: Ninja
       run: |
         if [ "$RUNNER_OS" == "Windows" ]; then
           export CC=cl.exe
           export CXX=cl.exe
         fi
         scripts/build.sh ${{ matrix.extensions == 'ON' && 'dev-ext' || 'dev' }} \
           -DBUILD_SHARED_LIBS=${{ matrix.shared }} \
           -DCMAKE_INSTALL_PREFIX="${CONDA_PREFIX}" \
           -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON

     - name: Test
       shell: bash -l {0}
       run: scripts/test.sh ${{ matrix.extensions == 'ON' && 'dev-ext' || 'dev' }}

     - name: Install
       shell: bash -l {0}
       run: cmake --install build/${{ matrix.extensions == 'ON' && 'dev-ext' || 'dev' }}

  # macOS only for now. Linux and Windows fail to build the wheel due to
  # pre-existing issues in the project's CMake setup (Ubuntu's libzstd-dev is
  # non-PIC so it can't link into a shared module, and Windows hits flaky
  # zlib.net 404s during FetchContent). Both warrant their own follow-up PRs.
  python-tests:
    name: Python tests on macos-latest (extensions=${{ matrix.extensions }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        extensions: [ON, OFF]

    steps:
     - uses: actions/checkout@v4
     - uses: actions/setup-python@v5
       with:
         python-version: "3.12"

     - name: Build bindings and run pytest
       shell: bash
       run: scripts/test-python.sh ${{ matrix.extensions == 'ON' && '--ext' || '' }} -- -v

  # Ubuntu only: wasm output is platform-independent, so there is no value in
  # running on macOS or Windows.
  build-wasm:
    name: wasm with SPZ_BUILD_EXTENSIONS=${{matrix.extensions}}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extensions: [ON, OFF]

    env:
      PRESET: ${{ matrix.extensions == 'ON' && 'wasm-ext' || 'wasm' }}

    steps:
     - uses: actions/checkout@v4
     - uses: emscripten-core/setup-emsdk@v16

     - name: Configure and build
       env:
         CMAKE_GENERATOR: Ninja
       run: scripts/build.sh ${{ env.PRESET }}

     - name: Check artifacts
       run: |
         for f in spz.js spz.d.ts spz-helpers.js spz-helpers.d.ts; do
           test -s "build/${{ env.PRESET }}/dist/$f" || { echo "missing dist/$f"; exit 1; }
         done

  build-android:
    name: android ${{ matrix.abi }} SPZ_BUILD_EXTENSIONS=${{ matrix.extensions }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a]
        extensions: [ON, OFF]

    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27d
          add-to-path: false

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure and build
        env:
          CMAKE_GENERATOR: Ninja
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: scripts/build.sh ${{ matrix.extensions == 'ON' && 'android-arm64-ext' || 'android-arm64' }}
