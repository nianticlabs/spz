<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SPZ 4DGS viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 13px system-ui, sans-serif; }
    #canvas { width: 100%; height: 100%; display: block; }
    #drop { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            pointer-events: none; font-size: 18px; color: #888; }
    #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; align-items: center;
           padding: 10px 14px; background: rgba(0, 0, 0, 0.6); }
    #bar[hidden] { display: none; }
    #timeline { flex: 1; }
    #status { position: fixed; top: 10px; left: 14px; white-space: pre; color: #9a9; }
    button { min-width: 64px; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="drop">Drop an animated .spz here, or open ?clip=&lt;url&gt;</div>
  <div id="status"></div>
  <div id="bar" hidden>
    <button id="play">Pause</button>
    <input id="timeline" type="range" min="0" max="1" step="0.001" value="0">
    <span id="time">0.00 s</span>
    <label><input id="loop" type="checkbox" checked> loop</label>
  </div>
  <script type="importmap">
    {
      "imports": {
        "playcanvas": "https://cdn.jsdelivr.net/npm/playcanvas@2.23.3/build/playcanvas/src/index.js",
        "playcanvas/scripts/esm/camera-controls.mjs": "https://cdn.jsdelivr.net/npm/playcanvas@2.23.3/scripts/esm/camera-controls.mjs"
      }
    }
  </script>
  <script type="module" src="./viewer.js"></script>
</body>
</html>
